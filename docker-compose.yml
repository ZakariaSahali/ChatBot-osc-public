services:
  chatbot:
    build: .
    container_name: osc-chatbot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
